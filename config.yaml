# ─────────────────────────────────────────────────────────────
#  GTA clipper config. Edit this file, commit, done.
# ─────────────────────────────────────────────────────────────

# Streamers to clip. Use channels that allow clipping (e.g. ones running a
# clipping campaign on Whop Content Rewards) so your accounts don't get strikes.
#
#   name:    lowercase, no spaces or underscores.
#   videos:  optional list of video links you add by hand (YouTube, Twitch, Kick).
#            They are clipped before the channel's own VODs, newest added first.
#   url:     Twitch:  https://www.twitch.tv/<name>/videos?filter=archive
#            Kick:    https://kick.com/<name>/videos
#            YouTube: https://www.youtube.com/@<name>/streams   (needs YTDLP_COOKIES secret)
#   facecam: optional [x, y, width, height] of the webcam (fractions of the frame).
#            Leave null: the bot finds the facecam itself (face detection).
#   credit:  shown on every clip and in captions.
#   hashtags: extra hashtags for this streamer (campaign requirements).
streamers:
  # GTA 6 launch marathons with Reach / Content Rewards pool campaigns on Whop.
  # Rules: streamer is the main focus, name + hashtag in caption, English
  # audience, submit each post link within 30 minutes.
  # Join each campaign before posting their clips.
  - name: lacy
    url: https://www.twitch.tv/lacy/videos?filter=archive
    facecam: null
    credit: "LACY"           # campaign: name must be in caption/overlay
    hashtags: "#LACY"        # campaign: required hashtag
  - name: clix
    url: https://www.twitch.tv/clix/videos?filter=archive
    facecam: null
    credit: "Clix"           # campaign: name must be in caption/overlay
    hashtags: "#Clix"        # campaign: required hashtag
  - name: kaicenat
    # Kai's Twitch has no public VODs; his marathon is also live on YouTube
    # (@KaiCenatLive), so the bot reads his YouTube streams (needs YTDLP_COOKIES).
    # Extra links can go under videos: (newest at the bottom).
    url: https://www.youtube.com/@KaiCenatLive/streams
    videos:
      # - https://www.youtube.com/watch?v=XXXXXXXXXXX
    facecam: null
    credit: "Kai Cenat"      # campaign: name must be in caption/overlay
    hashtags: "#KAICENAT"    # campaign: required hashtag

# Only look at the newest N VODs of each channel.
look_back_vods: 2
# Long streams (24/7 marathons) are clipped in chunks of this many hours,
# newest part first. Each run handles one chunk per streamer.
chunk_hours: 3
# Wait until a stream has at least this many new minutes before clipping again.
min_new_minutes: 20
# How many clips to cut from each chunk.
clips_per_vod: 8
clip_min_seconds: 15
clip_max_seconds: 35
# Keep this many clips waiting per streamer (posting takes turns between streamers).
clips_per_streamer: 8

# Speech-to-text model (faster-whisper): tiny, base, small. Bigger = slower, better.
whisper_model: base
# More accurate model used only for the on-screen captions of each short clip.
caption_model: small.en
# Language of the streams, or null to auto-detect.
language: en

# Claude model that picks the best moments and writes titles.
llm_model: claude-sonnet-5-5


hashtags: "#gta6 #gtavi"

posting:
  # Profile name you created in Upload-Post (upload-post.com) and linked your
  # TikTok, Instagram and YouTube accounts to.
  upload_post_user: default
  platforms: [tiktok, instagram, youtube, x]
