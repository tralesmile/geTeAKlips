# ─────────────────────────────────────────────────────────────
#  GTA clipper config. Edit this file, commit, done.
# ─────────────────────────────────────────────────────────────

# Streamers to clip. Use channels that allow clipping (e.g. ones running a
# clipping campaign on Whop Content Rewards) so your accounts don't get strikes.
#
#   name:    lowercase, no spaces or underscores.
#   videos:  optional list of video links you add by hand (YouTube, Twitch, Kick).
#            They are clipped before the channel's own VODs, newest added first.
#   url:     Twitch:  https://www.twitch.tv/<name>/videos?filter=archive
#            Kick:    https://kick.com/<name>/videos
#            YouTube: https://www.youtube.com/@<name>/streams   (needs YTDLP_COOKIES secret)
#   facecam: optional [x, y, width, height] of the webcam (fractions of the frame).
#            Leave null: the bot finds the facecam itself (face detection).
#   credit:  shown on every clip and in captions.
#   campaign / campaigns: Whop campaign page(s); the phone alert gets a button per campaign.
#   focus:   what kind of moments to pick (default: "while they are playing GTA 6").
#   hashtags: extra hashtags for this streamer (campaign requirements).
streamers:
  # GTA 6 launch marathons with Reach / Content Rewards pool campaigns on Whop.
  # Rules: streamer is the main focus, name + hashtag in caption, English
  # audience, submit each post link within 30 minutes.
  # Join each campaign before posting their clips.
  - name: lacy
    profile: default
    campaigns:
      - {label: "Lacy 30-Day", url: "https://whop.com/experiences/exp_6DJh0DkDMhATvG/campaigns/dc7183a8-7779-4b54-99a8-b7ac8c8452ec"}
      - {label: "Lacy GTA", url: "https://whop.com/experiences/exp_KZckYGtrnbujDg/campaigns/a5c63fad-cd53-4b81-9305-4a2d1696872a"}
      - {label: "CORE", url: "https://whop.com/experiences/exp_6DJh0DkDMhATvG/campaigns/2886f500-f062-48dd-a9b4-9de5725f8186", note: "only if 2+ CORE members are in the clip"}
    # $25K Lacy 30-Day campaign accepts any Lacy content (until Dec 21), not just GTA
    focus: "featuring Lacy (GTA 6, IRL, just chatting or with his CORE friends)"
    youtube: https://www.youtube.com/@LacyHimself/videos
    url: https://www.twitch.tv/lacy/videos?filter=archive
    facecam: null
    credit: "LACY"           # campaign: name must be in caption/overlay
    hashtags: "#LACY"        # campaign: required hashtag
  - name: clix
    profile: dom
    campaigns:
      - {label: "Clix", url: "https://whop.com/experiences/exp_KZckYGtrnbujDg/campaigns/985dc674-c75e-44fc-ac87-1b1506324389"}
      - {label: "CORE", url: "https://whop.com/experiences/exp_6DJh0DkDMhATvG/campaigns/2886f500-f062-48dd-a9b4-9de5725f8186", note: "only if 2+ CORE members are in the clip"}
    url: https://www.twitch.tv/clix/videos?filter=archive
    facecam: null
    credit: "Clix"           # campaign: name must be in caption/overlay
    hashtags: "#Clix"        # campaign: required hashtag
  - name: kaicenat
    profile: kai
    campaign: https://whop.com/experiences/exp_KZckYGtrnbujDg/campaigns/1d2bcb00-c904-415f-aa82-f95b96baad86
    # Kai's Twitch has no public VODs; his marathon is also live on YouTube
    # (@KaiCenatLive), so the bot reads his YouTube streams (needs YTDLP_COOKIES).
    # Extra links can go under videos: (newest at the bottom).
    url: https://www.youtube.com/@KaiCenatLive/streams
    twitch: kaicenat         # his Twitch community clips are used too
    videos:
      # - https://www.youtube.com/watch?v=XXXXXXXXXXX
    facecam: null
    credit: "Kai Cenat"      # campaign: name must be in caption/overlay
    hashtags: "#KAICENAT"    # campaign: required hashtag
  - name: dom
    profile: dom
    campaign: https://contentrewards.com/c/campaigns/051002dd-5c46-43d0-a446-43f2957ba3a9
    # RUCKUS campaign: footage from Dom's GTA 6 streams on Kick (Nov 18 onward),
    # TikTok + YouTube Shorts only, paid-partnership disclosure required.
    url: https://kick.com/dasgasd3m/videos
    videos:
      # Nov 22 Kick GTA 6 VOD: only its last 3h were clipped, older parts still unclipped
      - https://kick.com/dasgasd3m/videos/01a1fa65-9620-775a-8dc0-b3e82aa77f6c
    facecam: null
    credit: "Dom"
    hashtags: "#dasgasdom3"
    paid_partnership: true
  - name: gtatop
    profile: gta
    # "GTA 6 Top Moments" account: the most-viewed fresh GTA 6 moments from
    # streamers who openly allow clipping (Reach / Content Rewards campaigns).
    # Not for campaign submissions, so no phone alerts.
    pool:
      lacy: "Lacy"
      clix: "Clix"
      kaicenat: "Kai Cenat"
      jasontheween: "JasonTheWeen"
      stableronaldo: "Stable Ronaldo"
      yourragegaming: "YourRAGE"
    gta_only: true
    credit: "GTA 6"
    notify: false

# Only look at the newest N VODs of each channel.
look_back_vods: 2
# Long streams (24/7 marathons) are clipped in chunks of this many hours,
# newest part first. Each run handles one chunk per streamer.
chunk_hours: 3
# Wait until a stream has at least this many new minutes before clipping again.
min_new_minutes: 20
# How many clips to cut from each chunk.
clips_per_vod: 8
clip_min_seconds: 15
clip_max_seconds: 35
# Moments are picked by popularity first (Twitch community clips by views,
# YouTube most-replayed). At most this many popular moments per streamer per run.
moments_per_run: 5
# Clips older than this are dropped instead of posted (fresh moments win).
max_clip_age_hours: 36
# Keep this many clips waiting per streamer (posting takes turns between streamers).
clips_per_streamer: 3

# Speech-to-text model (faster-whisper): tiny, base, small. Bigger = slower, better.
whisper_model: base
# More accurate model used only for the on-screen captions of each short clip.
caption_model: small.en
# Language of the streams, or null to auto-detect.
language: en

# Claude model that picks the best moments and writes titles.
llm_model: claude-sonnet-5-5


hashtags: "#gta6 #gtavi"

posting:
  # One Upload-Post profile per account set. Each streamer above says which
  # profile it posts to. times = when that account posts (your time zone);
  # a run only posts within window_minutes after one of its times.
  timezone: Europe/Skopje
  window_minutes: 45
  profiles:
    default:                       # Lacy
      platforms: [tiktok, instagram, youtube]   # X dropped: ~0 views
      times: ["15:07", "17:07", "21:07", "23:07"]
      # 2 extra Lacy posts a day on TikTok + YouTube only (carczarr IG already
      # gets the Kai/Dom mirrors, so it stays at a safe number of posts)
      extra_times: ["13:07", "19:07"]
      extra_platforms: [tiktok, youtube]
    kai:                           # Kai Cenat
      platforms: [tiktok, youtube]
      mirror: {profile: default, platforms: [instagram]}   # also to carczarr IG
      # new account: max 3/day for the first weeks (TikTok flags new accounts that post a lot)
      times: ["15:07", "18:07", "21:07"]
    gta:                           # GTA 6 Top Moments (many streamers)
      platforms: [tiktok]
      # TikTok restricted this new account for posting too much (until Nov 30);
      # restart gently with 2/day
      times: ["13:07", "19:07"]
    tips:                          # Yugoslovenko: original Serbian memes (no clips)
      kind: memes
      platforms: [instagram]
      times: ["13:07", "18:07", "22:07"]
    gtatips:                       # football tips (Serbian) on the gta profile's Instagram
      upload_user: gta
      kind: betting
      platforms: [instagram]
      times: ["13:07", "16:07", "19:07"]
    pink:                          # Pinkove Zvezde clips -> Yugoslovenko IG (Reels)
      upload_user: tips
      streamers: [pink]
      platforms: [instagram]
      times: ["14:07", "16:07", "20:07", "23:07"]   # memes post at 13/18/22
    dom:                           # Dom + Clix
      platforms: [tiktok, youtube]
      mirror: {profile: default, platforms: [instagram]}   # also to carczarr IG
      times: ["13:07", "16:07", "19:07"]        # new account: max 3/day

# Yugoslovenko meme page (profile "tips"): original memes about trending
# reality-TV news. No TV footage is used; Claude writes the joke, we design it.
memes:
  name: "Yugoslovenko"
  handle: "@yugoslovenko"
  queries: ["Zadruga", "Pinkove zvezde", "rijaliti Pink", "Zadruga svađa"]
  hashtags: "#zadruga #rijaliti #pinkovezvezde #memes #srbija #balkan #humor #yugoslovenko"
  # what each posting time is for: relatable = everyday Balkan life, mostly family
  # group-chat memes (best performer); vicevi = swipeable joke carousel.
  # (reality = Zadruga/Elita memes: switched off, they didn't land)
  slots: {"13:07": relatable, "18:07": vicevi, "22:07": relatable}
  story: true            # also put each meme in the Instagram Story
  reels: true            # post memes as short Reels (chat reveal / zoom / joke by joke)
  vicevi_days: [2, 6]    # vicevi carousel only on Wednesday and Sunday (Mon=0)

# Football tips page (Instagram of Upload-Post profile "gta"): 3 tips a day from
# today's real fixtures (Claude web search), short analysis, yesterday's record.
betting:
  handle: "@tipsterko"
  hashtags: "#tipsterko #tipovi #tipdana #fudbal #klađenje #tiket #srbija #ligašampiona #premierliga"
  story: true

# Pinkove Zvezde clips for Yugoslovenko (clipper/pink.py, made in make-clips.yml).
# Never the children's show (Pinkove Zvezdice).
pink:
  enabled: true
  # YouTube blocks downloads from GitHub's servers, so for now clips come only
  # from videos you upload to the "pink-inbox" release (phone or PC).
  youtube: false
  inbox_per_run: 3       # videos processed per run (make-clips runs every 2 h)
  inbox_clips_max: 8     # max clips from one video (a 3-hour episode = 8 clips = 2 days)
  long_model: base       # fast transcript for long episodes (captions still use small)
  max_age_hours: 168     # queued Pinkove Zvezde clips wait up to a week
  searches: ["Pinkove zvezde", "Pinkove zvezde žiri svađa", "Pinkove zvezde Karleuša Desingerica"]
  queue_target: 4
  max_age_days: 10
  videos_to_check: 12
  clip_min: 12
  clip_max: 30
  whisper_model: small
  hashtags: "#pinkovezvezde #yugoslovenko #balkan #srbija #smesno #viralno"
