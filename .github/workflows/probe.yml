name: Probe sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: denoland/setup-deno@v2   # YouTube needs a JS runtime for yt-dlp
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yt-dlp[default]"
      - name: Kick channel videos (Dom)
        run: |
          for u in "https://kick.com/dasgasd3m/videos" "https://kick.com/dasgasd3m"; do
            echo "== $u"; yt-dlp --flat-playlist -J --playlist-end 5 "$u" > k.json 2>k.err || tail -3 k.err
            python -c "import json;d=json.load(open('k.json'));print(d.get('title'),d.get('_type'));[print(e.get('id'),e.get('title'),e.get('duration'),e.get('url')) for e in (d.get('entries') or [])[:5]]" 2>/dev/null || true
          done
      - name: Kick one VOD info
        run: |
          U=$(python -c "import json;d=json.load(open('k.json'));print(d['entries'][0]['url'])" 2>/dev/null) || exit 0
          yt-dlp -J "$U" > v.json 2>v.err || tail -3 v.err
          python -c "import json;d=json.load(open('v.json'));print({k:d.get(k) for k in ('title','duration','timestamp','uploader')})" || true
