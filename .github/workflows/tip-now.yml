name: Post tip now

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tip-now
  cancel-in-progress: false

jobs:
  meme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests pillow
      - name: Make and post a football tip
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m clipper.betting
      - name: Save tips history
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "clip-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Update tips history" && git pull --rebase -X theirs && git push)
