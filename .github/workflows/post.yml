name: Post clip

on:
  schedule:
    # every hour 13:07-00:07 Skopje; each account only posts at its own times
    # (see posting.profiles in config.yaml)
    - cron: "7 12-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post now even outside the posting times"
        type: boolean
        default: false
      profile:
        description: "Only this account (default, kai, dom). Empty = all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: post-clip
  cancel-in-progress: false
# Backup: a Claude scheduled task also starts this workflow ~2 min after each
# slot, because GitHub sometimes skips scheduled runs. Duplicate runs are
# skipped by the 75-minute check in clipper/post.py.

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests pillow
      - name: Post next clip
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_POST: ${{ inputs.force && '1' || '0' }}
          POST_PROFILE: ${{ inputs.profile }}
        run: python -m clipper.post
      - name: Save whose turn it is
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "clip-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Update posting turn" && git pull --rebase -X theirs && git push)
