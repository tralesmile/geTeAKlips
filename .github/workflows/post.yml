name: Post clip

on:
  schedule:
    # 4 posts a day (UTC), all while you're awake to submit links within 30 min:
    # 14:07, 18:07, 21:07, 23:07 Skopje = 8am, noon, 3pm, 5pm US Eastern.
    - cron: "7 13,17,20,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-clip
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Post next clip
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m clipper.post
