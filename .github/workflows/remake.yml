name: Remake clips

on:
  workflow_dispatch:
    inputs:
      clips:
        description: 'JSON list like [{"name": "<queued clip name without .mp4>"}]'
        required: true

permissions:
  contents: write

jobs:
  remake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v2
      - name: Remake
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          REMAKE: ${{ inputs.clips }}
        run: python -m clipper.remake
      - name: Save remembered facecams
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "clip-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Update facecams" && git pull --rebase -X theirs && git push)
